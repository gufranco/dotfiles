################################################################################
# Terminal & Display
################################################################################
# Truecolor (RGB) is declared explicitly here so it applies even when $COLORTERM
# is not forwarded, for example over SSH. The first line uses set -s (replace) to
# reset the array on reload and prevent accumulation; sensible also enables RGB
# when $COLORTERM advertises truecolor.
set -s terminal-features 'xterm*:RGB'
set -sa terminal-features ',tmux-256color:RGB'
set -sa terminal-features ',screen*:RGB'

################################################################################
# Windows & Panes
################################################################################
# base-index, pane-base-index, renumber-windows, and aggressive-resize all come
# from tmux-sensible-revamped now. aggressive-resize is control-mode aware there:
# on for normal clients, off only under iTerm2's native integration. mode-keys is
# kept because EDITOR is not always a vi variant.

# Use vim key bindings in copy mode
setw -g mode-keys vi

# Window title settings
set -g allow-rename off
set -g set-titles on
set -g set-titles-string '#S:#W'

# Silence notifications
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

################################################################################
# Keybindings
################################################################################
# Window Navigation
# Usage: Prefix + Tab - Switch to last active window
bind Tab last-window

# Reload Configuration
# Usage: Prefix + r - Reload tmux config and show confirmation
bind r source-file ~/.dotfiles/tmux/.tmux.conf \; display "~/.dotfiles/tmux/.tmux.conf reloaded!"

# Edit Configuration
# Usage: Prefix + e - Open tmux config in $EDITOR, reload on exit
bind e new-window -n "~/.dotfiles/tmux/.tmux.conf" sh -c '_E=${VISUAL:-${EDITOR:-vim}}; case "$_E" in *vim*) "$_E" -c ":set syntax=tmux" ~/.dotfiles/tmux/.tmux.conf;; *) "$_E" ~/.dotfiles/tmux/.tmux.conf;; esac && tmux source-file ~/.dotfiles/tmux/.tmux.conf \; display "~/.dotfiles/tmux/.tmux.conf reloaded!"'

# Session Navigation
# Usage:
#   Prefix + BTab (Shift+Tab) - Switch to last session
#   Prefix + C-c - Create new session
#   Prefix + C-f - Find session (opens command prompt to search)
bind BTab switch-client -l
bind C-c new-session
bind C-f command-prompt -p find-session 'switch-client -t %%'

# Detach and Rename
# Usage:
#   Prefix + Q - Detach from tmux session
#   Prefix + A - Rename current window (GNU screen convention)
bind Q detach-client
bind A command-prompt -I "#W" { rename-window "%%" }

# Scrollback Search
# Usage:
#   Prefix + W - Open scrollback in vim (read-only, cursor at bottom)
#   Prefix + / - Search scrollback with fzf, selected line copied to tmux buffer
bind W run-shell 'f=$(mktemp "${TMPDIR:-/tmp}"/tmux-scrollback.XXXXXX) && tmux capture-pane -S -50000 -p > "$f" && tmux new-window "vim -R +\"normal G\" \"$f\"; rm -f \"$f\""'
bind / run-shell 'f=$(mktemp "${TMPDIR:-/tmp}"/tmux-scrollback.XXXXXX) && tmux capture-pane -S -50000 -p > "$f" && tmux new-window "selected=\$(fzf --tac --no-sort < \"$f\") && [ -n \"\$selected\" ] && printf \"%s\" \"\$selected\" | tmux load-buffer - && tmux display-message \"Copied to tmux buffer\"; rm -f \"$f\""'

# Copy Mode (Vim-style)
# Usage:
#   Prefix + [ - Enter copy mode
#   Prefix + Enter - Enter copy mode (alternative shortcut)
#   v - Start selection (visual mode)
#   C-v - Rectangle selection
#   H - Move to start of line
#   L - Move to end of line
#   Escape - Cancel selection and exit copy mode
#   y - Copy selection to the system clipboard and exit (bound by Sensible Revamped)
bind Enter copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi H send-keys -X start-of-line
bind -T copy-mode-vi L send-keys -X end-of-line

# Paste Buffers
# Usage:
#   Prefix + p - Paste from most recent buffer
#   Prefix + M-p - Choose which buffer to paste from (interactive); P is the
#                  tiling layout picker
# Use Prefix + # to list buffers.
bind p paste-buffer -p
bind M-p choose-buffer

################################################################################
# Plugins
################################################################################
# TPM - Tmux Plugin Manager. Clones, loads, and updates every plugin listed
# below. The run line at the very bottom of this file boots it.
#
# Keys:
#   Prefix + I       - install plugins newly added to this file
#   Prefix + U       - update installed plugins
#   Prefix + Alt + u - remove plugins no longer listed (clean)
set -g @plugin 'tmux-plugins/tpm'

# Sensible Revamped - version, OS, and terminal aware defaults. Loaded first on
# purpose: every default is set only if the option still holds tmux's own default
# (non-destructive), so anything set explicitly above always wins.
#
# What it normalizes (each gated by tmux version and terminal, no keys):
#   - escape-time          short, kills the ESC delay in vim
#   - truecolor            tmux-256color + RGB when the terminal advertises it
#   - set-clipboard on     OSC 52 copy, picks pbcopy/wl-copy/xclip by environment
#   - focus-events on      lets vim see focus gained and lost
#   - base-index 1, pane-base-index 1, renumber-windows on
#   - repeat-time          longer window for repeated prefix keys
#   - undercurl, allow-passthrough, extended-keys where the version supports them
set -g @plugin 'tmux-revamped/tmux-sensible-revamped'
# Its convenience keys stay off: tiling claims C-n and R after this plugin
# loads, Tab and Prefix + r already cover last-window and reload, and n and p
# move between windows.
set -g @sensible_revamped_keys 'off'

# Pain Control Revamped - vim-style pane and window control. Splits and new
# windows keep the current path.
#
# Navigation and resize:
#   Prefix + h/j/k/l       - select pane left/down/up/right
#   Prefix + H/J/K/L       - resize the pane (repeatable)
#
# Splits and windows (all keep the current path):
#   Prefix + |             - split right
#   Prefix + -             - split down
#   Prefix + \             - split full width
#   Prefix + _             - split full height
#   Prefix + " and %       - the default splits, now path-aware
#   Prefix + c             - new window in the current path
#   Prefix + < and >       - move the current window left/right (repeatable)
#   Prefix + S             - toggle synchronized input across panes
#
# vim_navigation is off on purpose. It binds prefixless Ctrl+h/j/k/l and Ctrl+\,
# which take Ctrl+l (clear screen) and other chords away from the shell. Every key
# combination must go through the prefix, so pane navigation stays on the
# Prefix + h/j/k/l binds above.
set -g @plugin 'tmux-revamped/tmux-pain-control-revamped'
set -g @pane_control_vim_navigation 'off'
# Keys handed to other plugins, so no key is bound twice. Tiling owns =, B, V,
# g and P, its balance, equalize, layout, scratchpad and picker keys, and fzf
# owns E. The pain-control actions with no counterpart move to the M- tier:
#   Prefix + M-R - respawn the pane, Prefix + M-T - set the pane title,
#   Prefix + M-= - swap with the marked pane
set -g @pane_control_disabled_keys 'B V E g'
set -g @pane_control_respawn_key 'M-R'
set -g @pane_control_pane_name_key 'M-T'
set -g @pane_control_swap_mark_key 'M-='

# Launcher Revamped - open a TUI app in a popup or a fresh window, always starting
# in the current pane's directory. List apps in @launcher_apps and set, per app,
# @launcher_<id>_{key,command,mode,name,width,height}. Popups need tmux 3.2 and
# fall back to a window automatically on older tmux.
#
# Apps:
#   Prefix + C-g           - lazygit, in an 80% popup (built-in default)
#   Prefix + C-t           - lazydocker, in a popup
#   Prefix + C-y           - yazi, in a window (built-in default)
#   Prefix + C-a           - claude, in a popup
#   Prefix + C-b           - browsh, in a popup
set -g @plugin 'tmux-revamped/tmux-launcher-revamped'
set -g @launcher_apps 'lazygit lazydocker yazi claude browsh'
set -g @launcher_lazydocker_key 'C-t'
set -g @launcher_claude_key 'C-a'
set -g @launcher_browsh_key 'C-b'

# Catppuccin (Mocha) - the theme; drives every status-bar color and shape.
#   @catppuccin_flavor 'mocha'                - palette
#   @catppuccin_window_status_style 'rounded' - rounded window tabs
#   @catppuccin_window_text / _current_text   - show the window name (#W)
#   @catppuccin_date_time_text ' %H:%M'       - 24h clock
# Status line: the session module on the left. On the right, pills for the git
# status of the active pane, CPU, RAM, and the clock. The git pill is drawn by
# the plugin itself, so it disappears outside a repository.
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'
set -g @catppuccin_date_time_text ' %H:%M'

# CPU, RAM, and Git Revamped feed the right side of the bar. Each one replaces
# its #{...} placeholders inside status-right when TPM loads it, so the
# Catppuccin modules are expanded into status-right with -F first, leaving the
# literal placeholders for the plugins to find. The revamped tier colors are
# full #[fg=...] styles, so they sit inside the module text rather than in
# Catppuccin's fg slot. Every color names a Catppuccin theme variable, which
# tmux expands inside the plugins' output, so the bar follows the flavor.
#   Prefix + M-c - CPU detail popup (btop)
#   Prefix + M   - RAM detail popup
set -g @plugin 'tmux-revamped/tmux-cpu-revamped'
set -g @plugin 'tmux-revamped/tmux-ram-revamped'
set -g @plugin 'tmux-revamped/tmux-git-revamped'
set -g @plugin 'tmux-revamped/tmux-disk-revamped'
set -g @plugin 'tmux-revamped/tmux-network-revamped'
set -g @plugin 'tmux-revamped/tmux-battery-revamped'
set -g @plugin 'tmux-revamped/tmux-time-revamped'
set -g @plugin 'tmux-revamped/tmux-gpu-revamped'
set -g @plugin 'tmux-revamped/tmux-music-revamped'
set -g @plugin 'tmux-revamped/tmux-weather-revamped'
set -g @cpu_revamped_low_fg_color '#[fg=#{@thm_green}]'
set -g @cpu_revamped_medium_fg_color '#[fg=#{@thm_yellow}]'
set -g @cpu_revamped_high_fg_color '#[fg=#{@thm_red}]'
set -g @ram_revamped_low_fg_color '#[fg=#{@thm_green}]'
set -g @ram_revamped_medium_fg_color '#[fg=#{@thm_yellow}]'
set -g @ram_revamped_high_fg_color '#[fg=#{@thm_red}]'
# Only percentages are on the bar. CPU shows its load in its tier colour;
# temperature has no sudoless source on Apple Silicon. RAM shows its use and swap use, which turns yellow while
# swap is in use. Each percentage carries the plugin's Nerd Font label.
set -g @cpu_revamped_icons 'nerd'
set -g @ram_revamped_icons 'nerd'
set -g @ram_revamped_swap_active_color '#[fg=#{@thm_yellow}]'
set -g @catppuccin_status_cpu_text_fg '#{E:@thm_fg}'
set -g @catppuccin_status_cpu_text_bg '#{E:@catppuccin_status_module_text_bg}'
set -g @catppuccin_cpu_text ' #{l:#{cpu_fg_color}}#{l:#{cpu_percentage}}#{l:#{cpu_alert}}'
set -g @catppuccin_status_ram_text_fg '#{E:@thm_fg}'
set -g @catppuccin_status_ram_text_bg '#{E:@catppuccin_status_module_text_bg}'
set -g @catppuccin_ram_text ' #{l:#{ram_fg_color}}#{l:#{ram_percentage}} #[fg=#{@thm_subtext_0}]#{l:#{ram_swap_color}}#{l:#{ram_swap}}'
set -g @catppuccin_status_cpu_icon_bg '#{@thm_yellow}'
set -g @catppuccin_status_ram_icon_bg '#{@thm_teal}'
set -g @git_revamped_before "#[fg=#{@thm_peach}]#{@catppuccin_status_left_separator}#[fg=#{@thm_crust},bg=#{@thm_peach}]\U000f02a2 #{@catppuccin_status_middle_separator}#[fg=#{@thm_fg},bg=#{@thm_surface_0}] "
set -g @git_revamped_after '#[fg=#{@thm_surface_0}]#{@catppuccin_status_right_separator}'
set -g @git_revamped_reset '#[fg=#{@thm_fg}]'
set -g @git_revamped_branch_icon ''
set -g @git_revamped_branch_color '#[fg=#{@thm_fg}]'
set -g @git_revamped_insertions_color '#[fg=#{@thm_green}]'
set -g @git_revamped_changed_color '#[fg=#{@thm_yellow}]'
set -g @git_revamped_deletions_color '#[fg=#{@thm_red}]'
set -g @git_revamped_untracked_color '#[fg=#{@thm_blue}]'
set -g @git_revamped_conflict_color '#[fg=#{@thm_red}]'
set -g @git_revamped_state_color '#[fg=#{@thm_peach}]'
# Provider and sync segments. The PR, review, issue and bug counts and the CI
# status come from gh or glab, run inside the active pane's repository as the
# account its user.email names, cached for five minutes, with zero counts
# hidden. Ahead and behind stay current through a background fetch every five
# minutes. Every segment uses the plugin's Nerd Font icon set.
#   Prefix + M-g - switch branch from a menu (refuses on a dirty tree)
#   Prefix + M-b - open the repository on GitHub or GitLab
set -g @git_revamped_icons 'nerd'
set -g @git_revamped_web '1'
set -g @git_revamped_web_zero '0'
set -g @git_revamped_ahead_behind '1'
set -g @git_revamped_autofetch '1'
set -g @git_revamped_stash '1'
set -g @git_revamped_staged '1'
set -g @git_revamped_key_menu 'M-g'
set -g @git_revamped_key_browse 'M-b'
set -g @git_revamped_pr_color '#[fg=#{@thm_teal}]'
set -g @git_revamped_review_color '#[fg=#{@thm_mauve}]'
set -g @git_revamped_issue_color '#[fg=#{@thm_blue}]'
set -g @git_revamped_bug_color '#[fg=#{@thm_red}]'
set -g @git_revamped_ahead_color '#[fg=#{@thm_green}]'
set -g @git_revamped_behind_color '#[fg=#{@thm_yellow}]'
set -g @git_revamped_stash_color '#[fg=#{@thm_mauve}]'
set -g @git_revamped_staged_color '#[fg=#{@thm_green}]'
set -g @git_revamped_ci_pass_label ''
set -g @git_revamped_ci_pass_color '#[fg=#{@thm_green}]'
set -g @git_revamped_ci_fail_label ''
set -g @git_revamped_ci_fail_color '#[fg=#{@thm_red}]'
set -g @git_revamped_ci_pending_label ''
set -g @git_revamped_ci_pending_color '#[fg=#{@thm_yellow}]'

# Weather shows the sky icon in its condition colour, the temperature in its
# band colour, and an umbrella only when today's rain chance reaches half.
# Music, system, network, weather and time pills. Music is drawn by its plugin
# and disappears when nothing plays; its keys are Prefix + M-m play or pause,
# Prefix + M-. next and Prefix + M-, previous. The system pill holds CPU, GPU,
# RAM, swap, disk and
# battery, each value behind its own icon and in its own tier colour; battery
# renders nothing on hardware without one, so it drops out of the pill there.
# Each pill's tab colour says what it is: pink for music, peach for git, green
# for system health, blue for the network, yellow for the weather and lavender
# for the clock, none of them the
# mauve of the session and window tabs on the left.
# Disk, network, battery and time detail: Disk shows the used percentage of the
# APFS data volume, since the sealed system volume / reports only its own share,
# network the download and upload rates, battery a charge level glyph beside its
# percentage, both in the charge tier colour inside a fixed pill, drawn by the plugin so the pill exists
# only on hardware with a battery, and the clock pill the local time with New York and Los
# Angeles, in the theme's text colour, each with a time-of-day icon in its
# own colour. Every value carries the
# plugin's Nerd Font label. The battery popup moves off M-b, which opens the
# repository on its forge.
#   Prefix + M-B - battery detail popup
set -g @gpu_revamped_icons 'nerd'
set -g @gpu_revamped_low_fg_color '#[fg=#{@thm_green}]'
set -g @gpu_revamped_medium_fg_color '#[fg=#{@thm_yellow}]'
set -g @gpu_revamped_high_fg_color '#[fg=#{@thm_red}]'
