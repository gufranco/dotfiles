if-shell 'test -f ~/.tmux/plugins/tmux/catppuccin.tmux' "run '~/.tmux/plugins/tmux/catppuccin.tmux'"
set -g status-left-length 100
set -g status-right-length 200
set -g status-left '#{E:@catppuccin_status_session}'
source-file -q "$HOME/.dotfiles/tmux/status/system.conf"
source-file -q "$HOME/.dotfiles/tmux/status/net.conf"
source-file -q "$HOME/.dotfiles/tmux/status/weather.conf"
