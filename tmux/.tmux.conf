set -g @time_revamped_weekend_color '#[fg=#{@thm_fg}]'
set -g @time_revamped_sunrise_icon "#[fg=#{@thm_peach}]\U000f059c#[fg=#{@thm_fg}]"
set -g @time_revamped_morning_icon "#[fg=#{@thm_yellow}]\U000f05a8#[fg=#{@thm_fg}]"
set -g @time_revamped_day_icon "#[fg=#{@thm_peach}]\U000f0599#[fg=#{@thm_fg}]"
set -g @time_revamped_afternoon_icon "#[fg=#{@thm_teal}]\U000f0599#[fg=#{@thm_fg}]"
set -g @time_revamped_sunset_icon "#[fg=#{@thm_peach}]\U000f059a#[fg=#{@thm_fg}]"
