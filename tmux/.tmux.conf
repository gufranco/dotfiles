set -g @weather_revamped_cool_color '#[fg=#{@thm_teal}]'
set -g @weather_revamped_comfortable_color '#[fg=#{@thm_green}]'
set -g @weather_revamped_hot_color '#[fg=#{@thm_peach}]'
set -g @weather_revamped_very_hot_color '#[fg=#{@thm_red}]'
set -g @weather_revamped_clear_tint '#[fg=#{@thm_yellow}]'
set -g @weather_revamped_clouds_tint '#[fg=#{@thm_overlay_2}]'
set -g @weather_revamped_fog_tint '#[fg=#{@thm_overlay_2}]'
set -g @weather_revamped_rain_tint '#[fg=#{@thm_blue}]'
set -g @weather_revamped_snow_tint '#[fg=#{@thm_fg}]'
set -g @weather_revamped_storm_tint '#[fg=#{@thm_mauve}]'
set -g @weather_revamped_umbrella_text " #[fg=#{@thm_blue}]\U000f054a"
set -g @time_revamped_icon_position 'before'
set -g @music_revamped_max_len '30'
set -g @music_revamped_playpause_key 'M-m'
set -g @music_revamped_next_key 'M-.'
