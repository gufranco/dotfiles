---
name: Lint
run-name: >-
  Lint (${{
    github.event_name == 'schedule' && 'scheduled' ||
    github.event_name == 'workflow_dispatch' && 'manual' ||
    github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) ||
    format('push {0}', github.sha)
  }})

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install ShellCheck
        run: |
          set -euo pipefail
          gh release download v0.11.0 --repo koalaman/shellcheck --pattern 'shellcheck-v0.11.0.linux.x86_64.tar.xz' --output shellcheck.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz --strip-components=1 --wildcards '*/shellcheck'
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Run ShellCheck
        run: |
          set -euo pipefail
          ./shellcheck --version
          ./shellcheck install.sh
          ./shellcheck .github/scripts/*.sh
          ./shellcheck -x -e SC1091 zsh/config/* zsh/modules/*
          ./shellcheck -x -s sh -o all bin/* lib/disk/*.sh
          ./shellcheck -x -o all tests/disk/*.sh tests/disk/*.bash tests/disk/*.bats tests/disk/shim/*

  disk-tests:
    name: Disk tools (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install shells and bats (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats dash zsh
      - name: Install shells and bats (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core dash
      - name: Run every shell
        run: sh tests/disk/run-matrix.sh tests/disk

  shfmt:
    name: shfmt
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install shfmt
        run: |
          set -euo pipefail
          gh release download v3.14.1 --repo mvdan/sh --pattern 'shfmt_v3.14.1_linux_amd64' --output shfmt
          echo "76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf  shfmt" | sha256sum -c -
          chmod +x shfmt
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check formatting
        run: ./shfmt -i 2 -ci -d install.sh .github/scripts/*.sh

  zsh-syntax:
    name: Zsh syntax
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Check zsh files
        run: |
          set -euo pipefail
          errors=0
          for f in zsh/config/* zsh/modules/*; do
            [ -f "$f" ] || continue
            if zsh -n "$f" 2>&1; then
              echo "OK: $f"
            else
              echo "FAIL: $f"
              errors=$((errors + 1))
            fi
          done
          exit "$errors"
      - name: Check for shadowed zsh special parameters
        run: python3 .github/scripts/check-zsh-special-params.py

  actionlint:
    name: actionlint
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          set -euo pipefail
          gh release download v1.7.12 --repo rhysd/actionlint --pattern 'actionlint_1.7.12_linux_amd64.tar.gz' --output actionlint.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Run actionlint
        run: ./actionlint

  config-lint:
    name: YAML & TOML lint
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install yamllint
        run: pip install --quiet yamllint==1.38.0
      - name: Lint YAML files
        run: |
          set -euo pipefail
          errors=0
          while IFS= read -r f; do
            if yamllint -d "{extends: default, rules: {line-length: disable, truthy: disable, braces: {max-spaces-inside: 1}}}" "$f" 2>&1; then
              echo "OK: $f"
            else
              errors=$((errors + 1))
            fi
          done < <(find . \( -name '*.yml' -o -name '*.yaml' \) -type f \
            -not -path './tmux/plugins/*' \
            -not -path './vim/plugged/*' | sort)
          exit "$errors"
      - name: Lint TOML files
        run: |
          set -euo pipefail
          python3 -c "
          import tomllib, sys, pathlib

          excludes = ('tmux/plugins', 'vim/plugged')
          files = [f for f in pathlib.Path('.').rglob('*.toml')
                   if not f.is_symlink()
                   and not any(e in str(f) for e in excludes)]
          errors = 0
          for f in sorted(files):
              try:
                  tomllib.load(open(f, 'rb'))
                  print(f'OK: {f}')
              except Exception as e:
                  print(f'FAIL: {f}: {e}')
                  errors += 1
          sys.exit(errors)
          "

  python-tests:
    name: Python tests
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

  secrets:
    name: Secrets scan
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern 'gitleaks_8.30.1_linux_x64.tar.gz' --output gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Scan for secrets
        run: ./gitleaks detect --source . --verbose
