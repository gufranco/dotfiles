---
version: "2"
linters:
  default: standard
  enable:
    - reassign
    - gocritic
    - revive
    - gochecknoglobals
  settings:
    reassign:
      patterns:
        - ".*"
    gocritic:
      enabled-checks:
        - appendAssign
    revive:
      rules:
        - name: modifies-value-receiver
