---
name: Install
run-name: >-
  Install (${{
    github.event_name == 'schedule' && 'scheduled' ||
    github.event_name == 'workflow_dispatch' && 'manual' ||
    github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) ||
    format('push {0}', github.sha)
  }})

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [master]
    paths:
      - 'install.sh'
      - 'zsh/**'
      - 'Brewfile'
      - 'Uvfile'
      - 'mise/**'
      - '.github/workflows/install.yml'
      - '.github/scripts/**'
  pull_request:
    branches: [master]
    paths:
      - 'install.sh'
      - 'zsh/**'
      - 'Brewfile'
      - 'Uvfile'
      - 'mise/**'
      - '.github/workflows/install.yml'
      - '.github/scripts/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "1"
  GIT_TERMINAL_PROMPT: "0"

jobs:
  macos:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            name: macOS Tahoe (arm64)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Free disk space
        run: |
          # macOS: iOS/watchOS/tvOS/visionOS simulators and Xcode extras
          sudo rm -rf /Library/Developer/CoreSimulator/Volumes/* 2>/dev/null || true
          sudo rm -rf /Library/Developer/CoreSimulator/Cryptex/* 2>/dev/null || true
          xcrun simctl delete all 2>/dev/null || true
          # macOS arm64: pre-installed Homebrew packages fill the smaller disk
          if [ "$(uname -m)" = "arm64" ] && command -v brew >/dev/null 2>&1; then
            brew list --formula | xargs brew remove --force --ignore-dependencies 2>/dev/null || true
            brew cleanup --prune=all -s 2>/dev/null || true
          fi
          df -h /

      - name: Clear runner-image Homebrew conflicts
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew untap hashicorp/tap 2>/dev/null || true
          brew untap azure/bicep 2>/dev/null || true
          sudo rm -f /usr/local/bin/aws /usr/local/bin/aws_completer /usr/local/bin/pod 2>/dev/null || true

      - name: Use this checkout as ~/.dotfiles
        run: ln -sfn "$GITHUB_WORKSPACE" "$HOME/.dotfiles"

      - name: Run install.sh
        run: bash install.sh

      - name: Re-run install.sh (idempotency)
        run: bash install.sh

      - name: Verify symlinks
        run: bash .github/scripts/verify-symlinks.sh

      - name: Verify Homebrew packages
        run: |
          set -euo pipefail
          eval "$(/opt/homebrew/bin/brew shellenv 2>/dev/null || /usr/local/bin/brew shellenv 2>/dev/null)"
          brew bundle check --verbose --file Brewfile
          errors=0
          for cmd in bat fzf fd rg delta git zsh tmux vim gh node bun pnpm; do
            if command -v "$cmd" >/dev/null 2>&1; then
              echo "OK: $cmd ($(command -v "$cmd"))"
            else
              echo "FAIL: $cmd not found"
              errors=$((errors + 1))
            fi
          done
          exit $errors

      - name: Verify Oh My Zsh
        run: bash .github/scripts/verify-ohmyzsh.sh

      - name: Verify permissions
        run: bash .github/scripts/verify-permissions.sh
